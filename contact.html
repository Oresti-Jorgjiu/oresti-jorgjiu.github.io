<main id="main" class="site-main container">
  <header class="page-head" data-reveal>
    <h1 class="h1 aberrate">Contact</h1>
    <p class="sub">Fastest: email or LinkedIn.</p>
  </header>

  <section class="section grid two" data-reveal>
    <article class="card glass">
      <h2 class="h2">Direct</h2>
      <p><a class="link" href="mailto:jorgjiu.oresti@gmail.com">jorgjiu.oresti@gmail.com</a></p>
      <div class="row">
        <a class="btn small" data-link="linkedin" href="#" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        <a class="btn small ghost" data-link="credly" href="#" target="_blank" rel="noopener noreferrer">Credly ↗</a>
      </div>
    </article>

    <form class="card glass form" id="contact-form">
      <h2 class="h2">Message</h2>
      <label><span>Name</span><input name="name" autocomplete="name" required></label>
      <label><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
      <label><span>Message</span><textarea name="message" rows="5" required></textarea></label>
      <div class="row">
        <button class="btn primary" type="submit">Send</button>
        <button class="btn small ghost" type="button" data-copy-email hidden>Copy email</button>
      </div>
      <p class="form-note">Please use your real email so I can respond. Sending opens your own mail app — nothing is submitted to this site.</p>
      <p class="form-note" data-form-note role="status" aria-live="polite"></p>
    </form>
  </section>
